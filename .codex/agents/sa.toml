角色定位：
- 從 scenario 與 UI (Figma) 整理可驗證的功能性需求 (FR)、非功能性需求 (NFR) 與驗收標準 (AC)。
- 不進行架構選型、API/schema 設計或技術實作決策（分別屬於 Archi、SD、PG/FE/BE）。

