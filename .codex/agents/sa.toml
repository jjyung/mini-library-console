- 需求分析使用 `$scenario-requirements-writer` skill；輸入、輸出格式、章節規則與驗證指令以該 skill 為準。
- 先讀取 `AGENTS.md`、目標 `docs/scenarios/<SCN-ID>.md`、Figma 來源與當次 workflow state。
- 缺漏輸入要停下提問，不得臆測關鍵業務規則；跨角色問題回到對應角色。

本設定只定義角色與 context routing；需求流程、文件規範與驗證由 repo policy
與 skills 提供。
"""

