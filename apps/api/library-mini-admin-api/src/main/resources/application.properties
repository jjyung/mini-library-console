spring.application.name=library-mini-admin-api
spring.datasource.url=jdbc:h2:file:./target/library-mini-admin-db;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql
spring.jpa.hibernate.ddl-auto=none
app.environment=${APP_ENV:unknown}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
