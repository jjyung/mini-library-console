spring.application.name=library-mini-admin-api
server.port=8080
library.cors.allowed-origins=http://localhost:5173,http://localhost:4173
spring.datasource.url=jdbc:h2:file:./data/library-mini-admin-mvp-db;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.sql
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
